name: Web NGrams proof of concept

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: How many recent UTC minutes to probe (1–180)
        required: false
        default: "60"
      target_files:
        description: Stop after this many successful files (1–20)
        required: false
        default: "5"
  schedule:
    - cron: "35 6 * * *"
  push:
    paths:
      - "scripts/webngrams-smoke-test.mjs"
      - "data/webngrams-candidates.json"
      - "package.json"
      - ".github/workflows/webngrams-poc.yml"
  pull_request:
    paths:
      - "scripts/webngrams-smoke-test.mjs"
      - "data/webngrams-candidates.json"
      - "package.json"
      - ".github/workflows/webngrams-poc.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:webngrams

  sample:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:webngrams
      - name: Download and inspect available recent files
        run: npm run webngrams:test
        env:
          WEBNGRAMS_LOOKBACK_MINUTES: ${{ github.event.inputs.lookback_minutes || '60' }}
          WEBNGRAMS_TARGET_FILES: ${{ github.event.inputs.target_files || '5' }}
      - uses: actions/upload-artifact@v4
        with:
          name: webngrams-poc-snapshot
          path: output/webngrams-snapshot.*
          if-no-files-found: error
          retention-days: 30
