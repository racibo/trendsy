name: Web NGrams proof of concept

on:
  workflow_dispatch:
    inputs:
      sample_hours:
        description: Number of hourly samples across the previous 24 hours (1–24)
        required: false
        default: "24"
  schedule:
    - cron: "35 6 * * *"
  push:
    paths:
      - "scripts/webngrams-smoke-test.mjs"
      - "scripts/webngrams-review-audit.mjs"
      - "scripts/webngrams-review-audit-utils.mjs"
      - "tests/webngrams-review-audit.test.mjs"
      - "docs/webngrams-evidence-review.md"
      - "scripts/webngrams-matching.mjs"
      - "scripts/webngrams-sampling.mjs"
      - "scripts/archive-webngrams-daily.mjs"
      - "tests/webngrams-matching.test.mjs"
      - "tests/webngrams-sampling.test.mjs"
      - "tests/webngrams-archive.test.mjs"
      - "data/webngrams-candidates.json"
      - "package.json"
      - "docs/daily-data-archive.md"
      - ".github/workflows/webngrams-poc.yml"
  pull_request:
    paths:
      - "scripts/webngrams-smoke-test.mjs"
      - "scripts/webngrams-review-audit.mjs"
      - "scripts/webngrams-review-audit-utils.mjs"
      - "tests/webngrams-review-audit.test.mjs"
      - "docs/webngrams-evidence-review.md"
      - "scripts/webngrams-matching.mjs"
      - "scripts/webngrams-sampling.mjs"
      - "scripts/archive-webngrams-daily.mjs"
      - "tests/webngrams-matching.test.mjs"
      - "tests/webngrams-sampling.test.mjs"
      - "tests/webngrams-archive.test.mjs"
      - "data/webngrams-candidates.json"
      - "package.json"
      - "docs/daily-data-archive.md"
      - ".github/workflows/webngrams-poc.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:webngrams

  sample:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:webngrams
      - name: Download one representative file per UTC hour
        run: npm run webngrams:test
        env:
          WEBNGRAMS_SAMPLE_HOURS: ${{ github.event.inputs.sample_hours || '24' }}
      - uses: actions/upload-artifact@v4
        with:
          name: webngrams-poc-snapshot
          path: output/webngrams-snapshot.*
          if-no-files-found: error
          retention-days: 30

      - name: Report sampling completeness
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const snapshot = JSON.parse(await fs.readFile("output/webngrams-snapshot.json", "utf8"));
          const sampling = snapshot.sampling;
          const summary = [
            `## Web NGrams sampling: ${sampling.status}`,
            "",
            `- Successful hourly samples: **${sampling.successfulSampleHours}/${sampling.sampleHours}**`,
            `- Missing hourly samples: **${sampling.missingSampleHours}**`,
            `- Processing/request failures: **${sampling.failedFiles}**`,
            `- Normal missing-publication probes (HTTP 404): **${sampling.missingPublicationProbes}**`,
            ""
          ].join("\n");
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          if (sampling.status !== "COMPLETE") {
            console.log(`::warning::PARTIAL sample: ${sampling.successfulSampleHours}/${sampling.sampleHours} hourly samples succeeded.`);
            process.exitCode = 1;
          } else {
            console.log(`COMPLETE sample: all ${sampling.sampleHours} hourly samples succeeded.`);
          }
          NODE

      - name: Prepare Web NGrams evidence review worksheet
        if: success()
        run: npm run webngrams:review-audit

      - name: Upload Web NGrams evidence review worksheet
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webngrams-evidence-review
          path: output/webngrams-review-audit.*
          if-no-files-found: error
          retention-days: 30

      - name: Create compact daily history record
        if: (github.event_name == 'schedule' || github.event_name == 'push') && success()
        run: npm run webngrams:archive

      - name: Commit daily history
        if: (github.event_name == 'schedule' || github.event_name == 'push') && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then
            echo "No daily history changes to commit."
          else
            git commit -m "Archive Web NGrams daily metrics"
            git push
          fi

