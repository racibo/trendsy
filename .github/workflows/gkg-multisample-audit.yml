name: GKG multi-sample coverage audit

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gkg-multisample-audit.mjs"
      - "scripts/gkg-multisample-utils.mjs"
      - "tests/gkg-multisample-audit.test.mjs"
      - "package.json"
      - ".github/workflows/gkg-multisample-audit.yml"
  pull_request:
    paths:
      - "scripts/gkg-multisample-audit.mjs"
      - "scripts/gkg-multisample-utils.mjs"
      - "tests/gkg-multisample-audit.test.mjs"
      - "package.json"
      - ".github/workflows/gkg-multisample-audit.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:gkg-multisample

  live-audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check:gkg-multisample
      - name: Collect ten GKG batches and matching Web NGrams windows
        run: npm run gkg:multisample
        env:
          GKG_SAMPLE_COUNT: 10
          GKG_SAMPLE_SPACING_MINUTES: 150
      - uses: actions/upload-artifact@v4
        with:
          name: gkg-multisample-audit
          path: |
            output/gkg-multisample-audit.json
            output/gkg-multisample-audit.md
            output/gkg-multiday-comparison.json
            output/gkg-multiday-comparison.md
          if-no-files-found: error
          retention-days: 30
      - name: Commit daily history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gkg-multisample-history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: archive daily GKG coverage history"
            git push
          fi
      - name: Publish audit summary
        if: always() && hashFiles('output/gkg-multisample-audit.md') != ''
        run: cat output/gkg-multisample-audit.md >> "$GITHUB_STEP_SUMMARY"
