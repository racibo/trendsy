name: GDELT proof of concept

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check script syntax
        run: npm run check
      - name: Query GDELT
        run: npm run gdelt:test
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-poc-snapshot
          path: output/
          if-no-files-found: error
          retention-days: 30
