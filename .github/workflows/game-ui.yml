name: Trendsy game UI

on:
  pull_request:
    paths:
      - "web/**"
      - "netlify.toml"
      - "supabase/**"
      - "tests/supabase-game-rules.test.mjs"
      - "package.json"
      - ".github/workflows/game-ui.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "netlify.toml"
      - ".github/workflows/game-ui.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check Supabase game rules
        run: npm run check:supabase
      - name: Check required frontend files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          grep -q 'publish = "web"' netlify.toml
